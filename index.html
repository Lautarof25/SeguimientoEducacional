<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Progreso — Aula</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="app">
        <div class="shell" id="app">
            <header>
                <div class="progress-wrap">
                    <div class="progress-label"><span>Tu progreso</span><strong id="percent">35%</strong></div>
                    <div class="bar">
                        <div class="fill" id="fill"></div>
                    </div>
                </div>
            </header>

            <main>
                <iframe class="notion-frame" src="https://fan-utahraptor-cfe.notion.site/ebd/2a20c69b2e908195ac29ddf9c5af0cf4" title="Contenido de la lección" allowfullscreen></iframe>
                <section class="lesson" id="lesson">
                    <div class="action">
                        <label class="check">
                            <input type="checkbox" id="done">
                            <span class="box"></span>
                            <span class="check-text">
                                <strong>Marcar como completada</strong>
                                <span>Leí el contenido y estoy listo para continuar.</span>
                            </span>
                        </label>
                        <button id="continue" disabled>Continuar con el progreso →</button>
                        <div class="status">✓ Lección completada. ¡Buen trabajo!</div>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="javascript.js"></script>
</body>

</html>
