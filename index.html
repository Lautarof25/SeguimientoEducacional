<!doctype html>
<html lang="es">

    <title>Progreso — Aula</title>

<body>
    <section class="auth-screen" id="auth-screen" aria-labelledby="auth-title">
        <div class="auth-card">
            <p class="eyebrow">Aula</p>
            <h1 id="auth-title">Continúa tu recorrido</h1>
            <p class="auth-intro" id="auth-intro">Inicia sesión para guardar tu progreso en cada clase.</p>

            <form id="auth-form" novalidate>
                <label class="field">
                    <span>Email</span>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </label>
                <label class="field">
                    <span>Contraseña</span>
                    <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>
                </label>
                <label class="field confirm-field" id="confirm-field" hidden>
                    <span>Confirmar contraseña</span>
                    <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="6">
                </label>
                <button class="auth-submit" id="auth-submit" type="submit">Iniciar sesión</button>
                <p class="auth-message" id="auth-message" role="alert" aria-live="polite"></p>
            </form>

            <button class="auth-toggle" id="auth-toggle" type="button">¿Todavía no tienes una cuenta? Regístrate</button>
        </div>
    </section>

    <div class="app">

                </div>

                    <div class="progress-label"><span>Tu progreso</span><strong id="percent">0%</strong></div>
                    <div class="bar">

                    </div>
                </div>
            </header>

                        </div>
                        <div class="action">
                            <label class="check">
                                <input type="checkbox" class="done">
                                <span class="box"></span>
                                <span class="check-text">
                                    <strong>Marcar como completada</strong>
                                    <span>Leí el contenido y estoy listo para continuar.</span>
                                </span>
                            </label>
                            <button class="continue" disabled>Continuar con el progreso →</button>
