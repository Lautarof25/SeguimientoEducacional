<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Progreso — Aula</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="app">
        <div class="shell" id="app">
            <header>
                <div class="progress-wrap">
                    <div class="progress-label"><span>Tu progreso</span><strong id="percent">0%</strong></div>
                    <div class="bar">
                        <div class="fill" id="fill"></div>
                    </div>
                </div>
            </header>

            <main>
                <div class="lessons">
                    <section class="lesson active" id="lesson-1">
                        <div class="lesson-heading">
                            <span>Clase 1</span>
                        </div>
                        <div class="notion-frame-wrap">
                            <iframe class="notion-frame" src="https://fan-utahraptor-cfe.notion.site/ebd/3c50c69b2e9080d69f5eeb9d323c860a" title="Contenido de la clase 1" allowfullscreen></iframe>
                        </div>
                        <div class="action">
                            <label class="check">
                                <input type="checkbox" class="done">
                                <span class="box"></span>
                                <span class="check-text">
                                    <strong>Marcar como completada</strong>
                                    <span>Leí el contenido y estoy listo para continuar.</span>
                                </span>
                            </label>
                            <button class="continue" disabled>Continuar con el progreso →</button>
                            <div class="status">✓ Clase completada. ¡Buen trabajo!</div>
                        </div>
                    </section>
